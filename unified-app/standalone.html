// ═══════════════════════════════════════
// BACKEND CONNECTION CHECK
// ═══════════════════════════════════════
async function checkBackend() {
  try {
    const res = await fetch(`${backendBase}/api/health`, { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      backendAvailable = true;
      updateBackendIndicator();
      // Also fetch dynasties from real API
      const dr = await fetch(`${backendBase}/api/dynasties`);
      if (dr.ok) {
        const data = await dr.json();
        if (data?.length) {
          // Merge with local DYNASTIES (keep tint fallback data)
          data.forEach(api => {
            const local = DYNASTIES.find(d => d.id === api.id);
            if (local) { local.label = api.label; local.features = api.features || local.features; local.jadeTypes = api.jade_types || local.jadeTypes; }
          });
        }
      }
    }
  } catch(e) {
    backendAvailable = false;
    updateBackendIndicator();
  }
}

function updateBackendIndicator() {
  const el = document.getElementById('backendDot');
  if (!el) return;
  if (backendAvailable) {
    el.className = 'w-2 h-2 rounded-full bg-jade shadow-[0_0_6px_#4ade80]';
    el.title = 'AI后端已连接 — 使用真实生成';
  } else {
    el.className = 'w-2 h-2 rounded-full bg-fg3';
    el.title = '离线模式 — 使用本地处理。启动 python backend/main.py 连接AI';
  }
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function showToast(msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'px-5 py-2.5 rounded-xl bg-jade/15 border border-jade/30 text-jade text-sm font-medium backdrop-blur-md shadow-lg';
  t.style.animation = 'toastIn .3s ease-out forwards';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

function addRipple(el) {
  el.classList.add('relative');
  el.style.overflow = 'hidden';
  el.addEventListener('pointerdown', function(e) {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
    el.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });
}

// ═══════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════
function switchTab(tab) {
  activeTab = tab;
  // Update tab contents visibility
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  // Update tab bar buttons
  document.querySelectorAll('.tab-btn').forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.className = 'tab-btn flex flex-col items-center gap-0.5 px-4 py-1.5 min-w-[72px] rounded-xl transition-all duration-200 ' +
      (isActive ? 'text-jade scale-105' : 'text-fg3');
    const icon = b.querySelector('span:first-child');
    const dot = b.querySelector('.w-1');
    if (isActive) { icon.style.transform = 'scale(1.1) translateY(-2px)'; dot.classList.add('animate-pulse'); dot.style.opacity = '1'; }
    else { icon.style.transform = ''; dot.classList.remove('animate-pulse'); dot.style.opacity = '0'; }
    b.querySelector('span:nth-child(2)').className = 'text-[11px] font-medium ' + (isActive ? 'text-jade' : '');
  });
  // Update header
  const titles = {dynasty:['朝代滤镜','AI 重塑物品为各朝代玉器'],silkroad:['丝路玉路','全球玉文化交流史探索'],story:['玉文化典故','生成可分享的典故卡片']};
  document.getElementById('headerTitle').textContent = titles[tab][0];
  document.getElementById('headerSub').textContent = titles[tab][1];
  // Init tab-specific content
  if (tab === 'silkroad') { setTimeout(initMap, 100); }
  if (tab === 'dynasty') renderDynastyTab();
  if (tab === 'story') renderStoryTab();
  // Invalidate map size
  if (mapInstance) setTimeout(() => mapInstance.invalidateSize(), 300);
}

      </div>`
    : `<div class="relative rounded-2xl overflow-hidden border border-border bg-card">

      ${d.jadeTypes.map(j => `<span class="text-[10px] px-2 py-1 bg-gold/10 text-gold rounded-full">${j}</span>`).join('')}

  container.innerHTML = `<input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)" class="hidden"/>${uploadHTML}${selHTML}${ctaHTML}`;
  const btn = document.getElementById('generateBtn'); if (btn) addRipple(btn);
}

function handleFileSelect(e) { const f = e.target.files[0]; if (f) loadImage(f); }
function handleDrop(e) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadImage(f); }
function loadImage(file) {
  if (!file.type.startsWith('image/')) { showToast('请上传图片文件'); return; }
  const reader = new FileReader();
  reader.onload = function(ev) { dynastyPreview = ev.target.result; dynastyImage = file; dynastyResult = null; renderDynastyTab(); };
  reader.readAsDataURL(file);
}

async function generateJadeEffect() {
  if (!dynastyPreview || !dynastyImage) return;
  const d = DYNASTIES.find(x => x.id === selectedDynasty) || DYNASTIES[0];
  const container = document.getElementById('dynastyContent');
  const loadingHTML = `<div class="flex flex-col items-center justify-center py-20 gap-6"><div class="relative w-20 h-20"><svg class="spinner w-full h-full text-jade" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" opacity=".3"/><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="90 120" stroke-linecap="round" stroke-dashoffset="30"/></svg><span class="absolute inset-0 flex items-center justify-center text-2xl">💎</span></div><p class="font-display text-fg2 text-lg animate-pulse">${backendAvailable?'调用AI文心千年底蕴…':'依朝代之风，琢此物为玉…'}</p><p class="text-fg3 text-xs">${backendAvailable?'AI正在将您的物品重塑为'+d.label+'玉器':'本地处理模式 — 启动后端获得AI效果'}</p></div>`;
  container.innerHTML = loadingHTML;

  // Try backend first
  if (backendAvailable) {
    try {
      const fd = new FormData();
      fd.append('image', dynastyImage);
      fd.append('dynasty', selectedDynasty);
      const res = await fetch(`${backendBase}/api/generate-jade`, { method: 'POST', body: fd });
      if (res.ok) {
        const data = await res.json();
        dynastyResult = `${backendBase}${data.result_url}`;
        renderDynastyResult(d);
        showToast(`AI已生成${d.label}玉器效果 ✨`);
        return;
      }
    } catch(e) { console.warn('Backend jade generation failed, falling back to local:', e); }
  }

  // Fallback: local Canvas processing
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    const size = Math.min(img.width, img.height);
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const sx = (img.width - size) / 2; const sy = (img.height - size) / 2;
    ctx.drawImage(img, sx, sy, size, size, 0, 0, size, size);
    const imageData = ctx.getImageData(0, 0, size, size);
    const data = imageData.data;
    const [tr, tg, tb, alpha] = d.tint;
    for (let i = 0; i < data.length; i += 4) {
      const gray = data[i] * .299 + data[i+1] * .587 + data[i+2] * .114;
      data[i]   = data[i]   * (1-alpha) + gray * tr/255 * alpha * 255;
      data[i+1] = data[i+1] * (1-alpha) + gray * tg/255 * alpha * 255;
      data[i+2] = data[i+2] * (1-alpha) + gray * tb/255 * alpha * 255;
    }
    ctx.putImageData(imageData, 0, 0);
    ctx.filter = 'contrast(1.2) brightness(1.05)';
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = 'none';
    dynastyResult = canvas.toDataURL('image/png');
    renderDynastyResult(d);
    showToast('本地处理完成 (启动后端获得AI效果)');
  };
  img.src = dynastyPreview;
}

async function saveDynastyImage() {
  if (!dynastyResult) return;
  try {
    // If data URL, download directly
    if (dynastyResult.startsWith('data:')) {
      const a = document.createElement('a'); a.href = dynastyResult; a.download = `jade-${selectedDynasty}.png`; a.click();
    } else {
      // Fetch from backend and save
      const res = await fetch(dynastyResult); const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `jade-${selectedDynasty}.png`; a.click();
      URL.revokeObjectURL(url);
    }
    showToast('已保存至相册 ✨');
  } catch(e) { showToast('保存失败，请重试'); }
}

function initBeforeAfterSlider() {
  let dragging = false;
  const container = document.getElementById('baContainer');
  const before = document.getElementById('baBefore');
  const divider = document.getElementById('baDivider');
  if (!container || !before || !divider) return;
  function update(clientX) {
    const rect = container.getBoundingClientRect();
    const pct = Math.max(2, Math.min(98, ((clientX - rect.left) / rect.width) * 100));
    before.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
    divider.style.left = pct + '%';
  }
  document.getElementById('baHandle').addEventListener('mousedown', () => { dragging = true; });
  document.getElementById('baHandle').addEventListener('touchstart', (e) => { dragging = true; e.preventDefault(); });
  window.addEventListener('mousemove', (e) => { if (dragging) { e.preventDefault(); update(e.clientX); } });
  window.addEventListener('touchmove', (e) => { if (dragging) { e.preventDefault(); update(e.touches[0].clientX); } }, {passive:false});
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('touchend', () => { dragging = false; });
}

function renderRouteSwitcher() {
  const el = document.getElementById('routeSwitcher');
  if (!el) return;
  el.innerHTML = Object.entries(ROUTE_DATA).map(([id,r]) =>
    `<button onclick="switchRoute('${id}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all flex-shrink-0 ${silkroadRoute===id?'text-black font-semibold shadow-md':'bg-card border border-border text-fg2'}" style="${silkroadRoute===id?'background:'+r.color.line:''}"><span class="w-2 h-2 rounded-full" style="background:${r.color.line}"></span>${r.color.name}</button>`
  ).join('');
}

function initMap(retryCount) {
  initSilkRoadUI();
  renderRouteSwitcher();
  if (mapInstance) { mapInstance.invalidateSize(); updateRouteStyles(); return; }
  const mc = document.getElementById('mapContainer');
  if (!mc) return;
  // Retry up to 8 times if container hasn't been laid out yet
  if (mc.offsetHeight === 0) {
    if (!retryCount || retryCount < 8) {
      setTimeout(() => initMap((retryCount || 0) + 1), 100);
    }
    return;
  }
  mapInstance = L.map('mapContainer', {center:[25,30],zoom:2.2,minZoom:2,maxZoom:10,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(mapInstance);
  L.control.zoom({position:'bottomright'}).addTo(mapInstance);
  // Draw routes
  Object.entries(ROUTE_DATA).forEach(([id,r]) => {
    const poly = L.polyline(r.path, {color:r.color.line,weight:3,opacity:.8,dashArray:'10,8',lineCap:'round'}).addTo(mapInstance);
    routePolylines[id] = poly;
    const mg = L.layerGroup().addTo(mapInstance);
    routeMarkerGroups[id] = mg;
    r.markers.forEach(m => {
      const cm = L.circleMarker(m.latlng, {radius:6,fillColor:r.color.line,color:'#fff',weight:2,fillOpacity:.9}).addTo(mg);
      cm.bindPopup(`<div style="font-family:'Noto Sans SC',sans-serif;min-width:200px"><h4 style="font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;color:#f5f5f4;margin:0 0 2px">${m.name}</h4><p style="font-size:10px;color:#a8a29e;margin:0 0 6px">${m.en}</p><p style="font-size:11px;color:#a8a29e;line-height:1.5;margin:0 0 4px">${m.desc.substring(0,80)}...</p><p style="font-size:10px;color:#4ade80;margin:0">${m.artifact} · ${m.material}</p></div>`,{maxWidth:260});
      cm.on('click',() => showNodeSheet(m, r));
    });
  });
  eventLayerGroup = L.layerGroup().addTo(mapInstance);
  updateRouteStyles();
  updateTimelineEvents();
  updateEventStrip();
  updateYearLabel();
  // Keep map tiles in sync when container size changes
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (mapInstance) mapInstance.invalidateSize(); }).observe(mc);
  }
}

function updateRouteStyles() {
  Object.entries(routePolylines).forEach(([id,poly]) => {
    if (id === silkroadRoute) poly.setStyle({weight:4,opacity:1,dashArray:'12,6'});
    else poly.setStyle({weight:2,opacity:.35,dashArray:'8,10'});
  });
  const r = ROUTE_DATA[silkroadRoute];
  if (r && mapInstance) mapInstance.flyToBounds(L.latLngBounds(r.path), {padding:[40,40],maxZoom:6,duration:1});
}

function switchRoute(routeId) {
  silkroadRoute = routeId;
  renderRouteSwitcher();
  updateRouteStyles();
}

function closeNodeSheet() { selectedNode = null; document.getElementById('nodeSheet').innerHTML = ''; }

function setTimeline(year) {
  currentYear = year;
  document.getElementById('timeSlider').value = year;
  updateYearLabel();
  updateTimelineEvents();
  updateEventStrip();
}

function stepTimeline(delta) {
  setTimeline(Math.max(-2000, Math.min(1800, currentYear + delta)));
}

function togglePlay() {
  playing = !playing;
  document.getElementById('playBtn').style.background = playing ? '#dc2626' : '#4ade80';
  document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
  if (playing) { playTimer = setInterval(() => { if (currentYear >= 1800) { togglePlay(); return; } stepTimeline(100); }, 300); }
  else { clearInterval(playTimer); }
}

function updateYearLabel() {
  const el = document.getElementById('yearLabel');
  if (!el) return;
  if (currentYear < 0) el.textContent = `公元前 ${Math.abs(currentYear)} 年`;
  else if (currentYear === 0) el.textContent = '公元元年';
  else el.textContent = `公元 ${currentYear} 年`;
}

function updateTimelineEvents() {
  if (!eventLayerGroup || !mapInstance) return;
  eventLayerGroup.clearLayers();
  TIMELINE_EVENTS.forEach(evt => {
    if (evt.year <= currentYear && currentYear - evt.year <= 500) {
      const rc = ROUTE_DATA[evt.routeId]?.color?.line || '#4ade80';
      const m = L.marker(evt.latlng, {
        icon: L.divIcon({html:`<div style="width:14px;height:14px;border-radius:50%;background:${rc};border:3px solid #fff;box-shadow:0 0 10px ${rc}44;transform:scale(1.4)"></div>`,iconSize:[14,14],iconAnchor:[7,7]})
      }).addTo(eventLayerGroup);
      m.bindPopup(`<div style="font-family:'Noto Sans SC',sans-serif"><b style="color:#f5f5f4">${evt.icon} ${evt.title}</b><br><span style="font-size:10px;color:#a8a29e">${evt.label}</span><br><p style="font-size:11px;color:#a8a29e;margin-top:4px">${evt.summary}</p></div>`,{maxWidth:240});
    }
  });
}

function updateEventStrip() {
  const el = document.getElementById('eventStrip');
  if (!el) return;
  const visible = TIMELINE_EVENTS.filter(e => e.year <= currentYear).slice(-8);
  el.innerHTML = visible.map(e => `<button onclick="setTimeline(${e.year});if(mapInstance)mapInstance.flyTo([${e.latlng[0]},${e.latlng[1]}],6,{duration:1})" class="flex-shrink-0 bg-card border border-border rounded-lg p-2 text-left max-w-[180px] hover:border-jade/30 transition-colors"><span class="text-sm">${e.icon}</span><p class="text-[10px] text-fg2 font-medium mt-1 line-clamp-1">${e.title}</p><p class="text-[9px] text-fg3">${e.label}</p></button>`).join('');
}

  const container = document.getElementById('storyContent');
  if (!currentStory) {
    container.innerHTML = `
      <div class="flex gap-2">
        <input id="storyKeyword" placeholder="输入典故关键词…" maxlength="30" class="flex-1 px-4 py-3 bg-card border border-border rounded-xl text-fg1 placeholder:text-fg3 text-sm focus:border-jade/50 transition-colors"/>

      </div>
      <div><h3 class="text-xs text-fg3 mb-2.5 font-medium">热门典故 · 一键生成</h3>
      <div class="grid grid-cols-3 gap-2">${PRESETS.map(p => `<button onclick="doGenerateStory('${p.keyword}')" class="p-3 bg-card border border-border rounded-xl text-center hover:border-jade/40 active:scale-[.97] transition-all"><p class="font-display font-bold text-sm">${p.keyword}</p><p class="text-[10px] text-fg3 mt-1 line-clamp-1">${p.explanation}</p></button>`).join('')}</div></div>

async function doGenerateStory(kw) {
  const keyword = kw || document.getElementById('storyKeyword')?.value?.trim();
  if (!keyword) return;
  const container = document.getElementById('storyContent');
  container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 gap-6"><div class="relative w-20 h-20"><svg class="spinner w-full h-full text-jade" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" opacity=".3"/><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="90 120" stroke-linecap="round" stroke-dashoffset="30"/></svg></div><p class="font-display text-fg2 text-lg animate-pulse">${backendAvailable?'调用AI翻阅千年典籍…':'研墨写典，丹青绘玉…'}</p><p class="text-fg3 text-xs">${backendAvailable?'GPT-4正在生成典故释义':'本地模式 — 启动后端获得LLM生成'}</p></div>`;

  // Try backend first
  if (backendAvailable) {
    try {
      const res = await fetch(`${backendBase}/api/generate-story`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyword }),
        signal: AbortSignal.timeout(30000),
      });
      if (res.ok) {
        const data = await res.json();
        currentStory = {
          keyword, title: data.title, title_en: data.title_en,
          explanation: data.explanation, source: data.source, source_text: data.source_text,
          illustration_url: `${backendBase}${data.illustration_url}`, generated: data.generated,
        };
        renderStoryResult();
        showToast(data.generated ? 'AI已生成典故 ✨' : '已匹配预设典故');
        return;
      }
    } catch(e) { console.warn('Backend story generation failed, falling back to local:', e); }
  }

  // Fallback: preset matching
  let story = PRESETS.find(p => p.keyword === keyword);
  if (!story) story = {keyword,title:keyword,title_en:keyword,explanation:`「${keyword}」是中国玉文化中的经典典故，蕴含古人对美玉的崇敬与哲思。玉象征仁、义、智、勇、洁五德。`,source:'玉文化典故',source_text:'玉者，石之美者也，有五德。'};
  currentStory = story;
  setTimeout(() => renderStoryResult(), 800);
}

function renderStoryResult() {
  if (!currentStory) return;
  const s = currentStory;
  const container = document.getElementById('storyContent');
  container.innerHTML = `
    <div class="space-y-4">
      <div id="storyCardCapture" class="card-capture mx-auto">
        <div class="card-inner">
          <div class="aspect-square overflow-hidden bg-bg flex items-center justify-center" id="illustrationBox">
            ${s.illustration_url ? `<img src="${s.illustration_url}" alt="" class="w-full h-full object-cover" onerror="this.style.display='none';document.getElementById('storyIllustration').style.display='block';drawStoryIllustration(currentStory)"/>` : ''}
            <canvas id="storyIllustration" width="600" height="600" style="${s.illustration_url?'display:none':''}"></canvas>
          </div>
          <div class="p-6 space-y-4 text-center">
            <div><h2 class="font-display text-2xl font-bold">${s.title}</h2><p class="text-xs text-fg3 mt-1">${s.title_en||''}</p></div>
            <div class="flex items-center gap-2"><span class="flex-1 h-px bg-border"></span><span class="w-2 h-2 rounded-full bg-jade/60"></span><span class="flex-1 h-px bg-border"></span></div>
            <p class="font-display text-sm leading-relaxed text-fg2">${s.explanation}</p>
            <div class="space-y-2"><span class="inline-block px-3 py-1 border border-seal/40 text-seal text-xs font-calligraphy rounded" style="transform:rotate(-2deg)">${s.source}</span><p class="font-display text-sm text-fg3 italic">"${s.source_text}"</p></div>
          </div>
          <div class="h-1 bg-gradient-to-r from-jade/20 via-jade/50 to-jade/20"></div>
        </div>
      </div>
      <!-- Knowledge extension -->
      <div class="bg-card border border-border rounded-xl p-4 space-y-2">
        <h4 class="text-xs font-medium text-gold">📖 知识拓展</h4>
        <p class="text-sm text-fg2">这是"<span class="text-jade font-medium">${s.title}</span>"典故在<span class="text-gold font-medium">${s.source}</span>中的记载。</p>
        <div class="flex flex-wrap gap-2 text-xs">
          <a href="https://so.gushiwen.cn/search.aspx?value=${encodeURIComponent(s.source)}" target="_blank" rel="noopener" class="px-3 py-1.5 bg-bg border border-border rounded-lg text-fg2 hover:border-jade/40 transition-colors">查看《${s.source.replace(/[《》]/g,'')}》全文 →</a>
          <button onclick="doGenerateStory('君子佩玉')" class="px-3 py-1.5 bg-bg border border-border rounded-lg text-fg2 hover:border-jade/40 transition-colors">相关典故：玉有五德</button>
        </div>
      </div>
      <!-- Actions -->
      <div class="flex items-center gap-2 justify-center flex-wrap">
        <button onclick="saveStoryCard()" class="flex items-center gap-2 px-5 py-2.5 bg-jade text-black font-medium rounded-xl text-sm active:scale-95 transition-transform"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 保存图片</button>
        <button onclick="shareStory()" class="flex items-center gap-2 px-5 py-2.5 border border-border text-fg2 rounded-xl text-sm active:scale-95 transition-transform">分享卡片</button>
        <button onclick="currentStory=null;renderStoryTab()" class="text-fg3 text-sm underline underline-offset-4">换一个典故</button>
      </div>
    </div>`;
  // Draw illustration
  drawStoryIllustration(s);
  // Add ripple to buttons
  container.querySelectorAll('button').forEach(b => addRipple(b));
}

function drawStoryIllustration(story) {
  const canvas = document.getElementById('storyIllustration');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  // Rice paper background
  ctx.fillStyle = '#2a2824'; ctx.fillRect(0, 0, 600, 600);
  // Moon
  const cx = 300, cy = 240;
  for (let r = 140; r > 10; r -= 4) {
    const a = 1 - r/140;
    ctx.fillStyle = `rgba(230,225,215,${a*.15})`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  }
  // Mountains
  [[380,120,500],[430,180,650],[410,100,420]].forEach(([baseY,h,w]) => {
    ctx.fillStyle = 'rgba(80,75,68,.6)'; ctx.beginPath();
    ctx.moveTo((600-w)/2, 600);
    for (let i = 0; i <= 40; i++) {
      const x = (600-w)/2 + w*i/40;
      const y = baseY - h*(.4+.6*Math.sin(i*Math.PI/40)) + 15*Math.sin(i*7*Math.PI/40)*(1-i/40);
      ctx.lineTo(x, y);
    }
    ctx.lineTo((600+w)/2, 600); ctx.closePath(); ctx.fill();
  });
  // Pine branch
  ctx.strokeStyle = 'rgba(100,95,85,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(150, 380); ctx.quadraticCurveTo(170, 300, 190, 250); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const angle = -0.8 + i * .3;
    ctx.beginPath(); ctx.moveTo(170+i*2.5, 320-i*10);
    ctx.lineTo(170+i*2.5 + 30*Math.cos(angle), 320-i*10 + 30*Math.sin(angle)); ctx.stroke();
  }
  // Jade bi disc
  ctx.strokeStyle = 'rgba(74,222,128,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(420, 360, 28, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(420, 360, 6, 0, Math.PI*2);
  ctx.fillStyle = '#2a2824'; ctx.fill(); ctx.stroke();
  // Seal stamp
  ctx.fillStyle = '#dc2626'; ctx.fillRect(470, 420, 50, 50);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(478, 428, 14, 14);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(498, 428, 14, 14);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(478, 448, 14, 14);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(498, 448, 14, 14);
}

async function saveStoryCard() {
  const el = document.getElementById('storyCardCapture');
  if (!el) return;
  try {
    const dataUrl = await htmlToImage.toPng(el, {quality:.95,pixelRatio:2});
    const a = document.createElement('a'); a.href = dataUrl; a.download = `jade-story-${currentStory?.title||'card'}.png`; a.click();
    showToast('典故卡片已保存 ✨');
  } catch(e) { showToast('保存失败，请重试'); }
}

function shareStory() {
  if (!currentStory) return;
  const text = `【玉文化典故】${currentStory.title}\n\n${currentStory.explanation}\n\n——${currentStory.source}\n"${currentStory.source_text}"`;
  // Generate QR code
  const modal = document.getElementById('modalContainer');
  modal.innerHTML = `
    <div class="fixed inset-0 z-[2000] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this)document.getElementById('modalContainer').innerHTML=''">
      <div class="bg-card border border-border rounded-t-2xl sm:rounded-2xl max-w-sm w-full p-6 space-y-5" style="animation:slideUp .3s ease-out;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,12px))">
        <div class="flex items-center justify-between"><h3 class="font-display font-bold">分享典故卡片</h3><button onclick="document.getElementById('modalContainer').innerHTML=''" class="text-fg3 hover:text-fg2">✕</button></div>
        <div class="flex flex-col items-center gap-3 p-4 bg-bg rounded-xl"><canvas id="qrCanvas" width="200" height="200" class="rounded-lg"></canvas><p class="text-xs text-fg3">扫描二维码查看典故详情</p></div>
        <button onclick="copyStoryText()" class="w-full py-3 bg-jade text-black rounded-xl font-medium text-sm active:scale-95 transition-transform">复制典故文字</button>
        <p class="text-[11px] text-fg3 text-center">也可保存卡片图片后分享至微信朋友圈/小红书</p>
      </div></div>`;
  // Generate QR
  setTimeout(() => {
    try { QRCode.toCanvas(document.getElementById('qrCanvas'), text, {width:200,margin:2,color:{dark:'#f5f5f4',light:'#1a1a1a'}}, (err) => { if (err) console.error(err); }); }
    catch(e) { console.error('QR generation failed:', e); }
  }, 100);
}

function copyStoryText() {
  if (!currentStory) return;
  const text = `【玉文化典故】${currentStory.title}\n\n${currentStory.explanation}\n\n——${currentStory.source}\n"${currentStory.source_text}"`;
  navigator.clipboard.writeText(text).then(() => { showToast('已复制，可粘贴至微信/小红书'); document.getElementById('modalContainer').innerHTML = ''; }).catch(() => showToast('复制失败'));
}
