*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',sans-serif;background:#1a1a1a;color:#f5f5f4;overflow:hidden;height:100vh;-webkit-tap-highlight-color:transparent}
.tab-content{display:none;overflow-y:auto}
.tab-content.active{display:block;height:100%}
/* ripple */
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.35) 0%,rgba(74,222,128,0) 70%);transform:scale(0);animation:ripple .45s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(2.5);opacity:0}}
/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 1.2s linear infinite}
/* fadeIn */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* toast */
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Leaflet dark */
.leaflet-container{background:#1a1a1a!important}
.leaflet-control-zoom a{background:#262626!important;color:#f5f5f4!important;border-color:#333!important}
.leaflet-popup-content-wrapper{background:#262626!important;color:#f5f5f4!important;border-radius:12px!important;border:1px solid #333!important}
.leaflet-popup-tip{background:#262626!important}
.leaflet-popup-close-button{color:#a8a29e!important}
/* card capture */
.card-capture{max-width:420px;width:100%;margin:0 auto;background:#1a1a1a}
.card-inner{background:#262626;border:1px solid #333;border-radius:16px;overflow:hidden}
/* range slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#333;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#4ade80;border:3px solid #1a1a1a;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.4)}
/* scrollbar */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
/* safe area */
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,8px)}
.no-scrollbar::-webkit-scrollbar{display:none}

const KEY_STORAGE = 'jade.siliconflow.key';
const MODEL_STORAGE = 'jade.siliconflow.imageModel';
const DEFAULT_IMAGE_MODEL = 'Tongyi-MAI/Z-Image-Turbo';
const IMAGE_API = 'https://api.siliconflow.cn/v1/images/generations';

let SILICONFLOW_KEY = localStorage.getItem(KEY_STORAGE) || '';
let IMAGE_MODEL = localStorage.getItem(MODEL_STORAGE) || DEFAULT_IMAGE_MODEL;

function hasKey() { return !!SILICONFLOW_KEY.trim(); }

function updateKeyDot() {
  const dot = document.getElementById('keyDot');
  if (dot) dot.style.display = hasKey() ? 'none' : 'block';
}

function openKeySettings() {
  document.getElementById('keyInput').value = SILICONFLOW_KEY;
  document.getElementById('modelInput').value = IMAGE_MODEL;
  document.getElementById('keyModal').style.display = 'flex';
}

function closeKeySettings() {
  document.getElementById('keyModal').style.display = 'none';
}

function saveKeySettings() {
  SILICONFLOW_KEY = document.getElementById('keyInput').value.trim();
  IMAGE_MODEL = document.getElementById('modelInput').value.trim() || DEFAULT_IMAGE_MODEL;
  localStorage.setItem(KEY_STORAGE, SILICONFLOW_KEY);
  localStorage.setItem(MODEL_STORAGE, IMAGE_MODEL);
  updateKeyDot();
  closeKeySettings();
  showToast(SILICONFLOW_KEY ? 'API Key 已保存 ✨' : 'Key 已清空');
}

function clearKeySettings() {
  SILICONFLOW_KEY = '';
  localStorage.removeItem(KEY_STORAGE);
  document.getElementById('keyInput').value = '';
  updateKeyDot();
  closeKeySettings();
  showToast('已清除本机保存的 Key');
}

function requireKey() {
  if (hasKey()) return true;
  showToast('请先填写 API Key');
  openKeySettings();
  return false;
}

function showToast(msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'px-5 py-2.5 rounded-xl bg-jade/15 border border-jade/30 text-jade text-sm font-medium backdrop-blur-md shadow-lg';
  t.style.animation = 'toastIn .3s ease-out forwards';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

function addRipple(el) {
  el.classList.add('relative');
  el.style.overflow = 'hidden';
  el.addEventListener('pointerdown', function(e) {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    const x = e.clientX - rect.left - size/2;
    const y = e.clientY - rect.top - size/2;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
    el.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });
}

function switchTab(tab) {
  activeTab = tab;
  // Update tab contents visibility
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  // Update tab bar buttons
  document.querySelectorAll('.tab-btn').forEach(b => {
    const isActive = b.dataset.tab === tab;
    b.className = 'tab-btn flex flex-col items-center gap-0.5 px-4 py-1.5 min-w-[72px] rounded-xl transition-all duration-200 ' +
      (isActive ? 'text-jade scale-105' : 'text-fg3');
    const icon = b.querySelector('span:first-child');
    const dot = b.querySelector('.w-1');
    if (isActive) { icon.style.transform = 'scale(1.1) translateY(-2px)'; dot.classList.add('animate-pulse'); dot.style.opacity = '1'; }
    else { icon.style.transform = ''; dot.classList.remove('animate-pulse'); dot.style.opacity = '0'; }
    b.querySelector('span:nth-child(2)').className = 'text-[11px] font-medium ' + (isActive ? 'text-jade' : '');
  });
  // Update header
  const titles = {dynasty:['玉境 · 设计','择器选材，AI铸玉'],silkroad:['玉境 · 探索','全球玉文化交流史'],story:['玉境 · 品读','典故选读，以玉观文']};
  document.getElementById('headerTitle').textContent = titles[tab][0];
  document.getElementById('headerSub').textContent = titles[tab][1];
  // Init tab-specific content
  if (tab === 'silkroad') {
    // Delay until DOM is painted, then force map to recalculate
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        initMap();
      });
    });
  }
  if (tab === 'dynasty') renderDynastyTab();
  if (tab === 'story') renderStoryTab();
}

const CAT_ORDER = ['object','material','dynasty','visualStyle','bgColor','pattern','craft'];

async function loadDesignOptions() {
  if (designOptions) return designOptions;
  // Strip internal prompt fields for the UI
  designOptions = {};
  for (const [catKey, catVal] of Object.entries(DESIGN_OPTIONS)) {
    designOptions[catKey] = {
      label: catVal.label, icon: catVal.icon || '',
      required: catVal.required || false, multi: catVal.multi || false,
      options: catVal.options.map(o => ({id: o.id, label: o.label, desc: o.desc || '', color: o.color || ''}))
    };
  }
  return designOptions;
}

function buildDesignPrompt(selections) {
  const parts = [];
  if (selections.visualStyle) {
    const opt = DESIGN_OPTIONS.visualStyle.options.find(o => o.id === selections.visualStyle);
    if (opt) parts.push(opt.prompt);
  }
  let core = 'A Chinese jade artifact: ';
  const obj = DESIGN_OPTIONS.object.options.find(o => o.id === selections.object);
  if (obj) core += obj.prompt;
  const mat = DESIGN_OPTIONS.material.options.find(o => o.id === selections.material);
  if (mat) core += ', carved from ' + mat.prompt;
  const dyn = DESIGN_OPTIONS.dynasty.options.find(o => o.id === selections.dynasty);
  if (dyn) core += '. ' + dyn.prompt;
  parts.push(core);
  if (selections.patterns && selections.patterns.length) {
    const sel = DESIGN_OPTIONS.pattern.options.filter(o => selections.patterns.includes(o.id));
    if (sel.length) parts.push('Surface decoration: ' + sel.map(o => o.prompt).join('. ') + '.');
  }
  if (selections.crafts && selections.crafts.length) {
    const sel = DESIGN_OPTIONS.craft.options.filter(o => selections.crafts.includes(o.id));
    if (sel.length) parts.push('Carving technique: ' + sel.map(o => o.prompt).join('. ') + '.');
  }
  if (selections.bgColor) {
    const opt = DESIGN_OPTIONS.bgColor.options.find(o => o.id === selections.bgColor);
    if (opt) parts.push('Setting: ' + opt.prompt + '.');
  }
  parts.push('Professional product photography, studio lighting, square format.');
  return parts.join(' ');
}

function buildNegativePrompt(selections) {
  let neg = 'cartoon, low quality, blurry, watermark, text, signature, plastic, fake, 3D render, CGI, multiple objects, cluttered, distorted proportions, deformed, disfigured';
  const sn = {museum:'painting, sketch, cartoon, illustration, abstract', 'ink-wash':'photorealistic, sharp focus, hard edges, glossy, shiny, 3D render', court:'minimalist, empty space, monochrome, rough, primitive', minimal:'cluttered, ornate, complex, busy, baroque, elaborate', archaeological:'polished, perfect, shiny, clean, modern, studio lighting'};
  if (selections.visualStyle && sn[selections.visualStyle]) neg += ', ' + sn[selections.visualStyle];
  return neg;
}

function toggleDesignOption(catKey, optId, multi) {
  if (multi) {
    const current = designSelections[catKey] || [];
    designSelections[catKey] = current.includes(optId)
      ? current.filter(id => id !== optId)
      : [...current, optId];
  } else {
    designSelections[catKey] = designSelections[catKey] === optId ? undefined : optId;
  }
  renderDynastyTab();
}

function selectedCount(catKey) {
  const v = designSelections[catKey];
  if (!v) return 0;
  return Array.isArray(v) ? v.length : 1;
}

function canGenerate() {
  return designSelections.object && designSelections.material && designSelections.dynasty;
}

async function renderDynastyTab() {
  const container = document.getElementById('dynastyContent');
  const opts = await loadDesignOptions();

  if (!opts) {
    container.innerHTML = `<div class="text-center py-16 text-fg3"><p class="text-4xl mb-3">🔌</p><p>无法连接后端</p><p class="text-xs mt-1">请启动后端服务以使用设计功能</p></div>`;
    return;
  }

  let html = `<p class="text-xs text-fg3 text-center">分级选择，组合你的专属玉器设计</p>`;

  CAT_ORDER.forEach(catKey => {
    const cat = opts[catKey];
    if (!cat) return;
    const count = selectedCount(catKey);
    const sel = designSelections[catKey];
    const isMulti = cat.multi;

    // Selected chips (compact view)
    let chipsHTML = '';
    if (count > 0) {
      const ids = isMulti ? (sel || []) : [sel];
      chipsHTML = `<div class="flex flex-wrap gap-1.5 px-4 pb-2">${ids.map(id => {
        const o = cat.options.find(x => x.id === id);
        return o ? `<span class="text-[10px] px-2 py-1 bg-jade/10 text-jade rounded-full">${o.label}</span>` : '';
      }).join('')}</div>`;
    }

    // Option buttons
    const btnHTML = cat.options.map(opt => {
      const selected = isMulti ? (sel || []).includes(opt.id) : sel === opt.id;
      const colorDot = opt.color ? `<span class="w-3 h-3 rounded-full border border-white/20 flex-shrink-0" style="background:${opt.color}"></span>` : '';
      return `<button onclick="toggleDesignOption('${catKey}','${opt.id}',${isMulti})"
        class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-medium transition-all active:scale-95 ${selected
          ? 'bg-jade text-black'
          : 'bg-bg text-fg2 hover:bg-jade/10 border border-transparent hover:border-jade/30'}">
        ${colorDot}${opt.label}
      </button>`;
    }).join('');

    html += `
      <div class="bg-card border border-border rounded-2xl overflow-hidden mt-3">
        <div class="flex items-center gap-2 px-4 py-2.5">
          <span class="text-base">${cat.icon||''}</span>
          <span class="font-display font-semibold text-fg1 text-xs flex-1">${cat.label}${cat.required?' <span class="text-seal">*</span>':''}</span>
          ${count > 0 ? `<span class="px-1.5 py-0.5 bg-jade/15 text-jade text-[10px] rounded-full">${isMulti ? '已选'+count : '已选'}</span>` : ''}
        </div>
        <div class="px-3 pb-3 flex flex-wrap gap-1.5">${btnHTML}</div>
      </div>`;
  });

  html += `<button id="generateBtn" onclick="generateJadeDesign()" ${!canGenerate()?'disabled':''}
    class="w-full py-4 bg-gradient-to-r from-jade via-jade to-jade-deep text-black font-bold text-lg rounded-2xl mt-4
    disabled:opacity-25 disabled:cursor-not-allowed transition-all active:scale-[.98] shadow-lg shadow-jade/20">
    ${canGenerate() ? '✨ 生成玉器设计' : '请完成必选分类 (*)'}</button>`;

  container.innerHTML = html;
  const btn = document.getElementById('generateBtn'); if (btn) addRipple(btn);
}

async function generateJadeDesign() {
  if (!canGenerate()) return;
  if (!requireKey()) return;
  const container = document.getElementById('dynastyContent');
  container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 gap-6"><div class="relative w-20 h-20"><svg class="spinner w-full h-full text-jade" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" opacity=".3"/><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="90 120" stroke-linecap="round" stroke-dashoffset="30"/></svg><span class="absolute inset-0 flex items-center justify-center text-2xl">💎</span></div><p class="font-display text-fg2 text-lg animate-pulse">依汝之选，匠心琢玉…</p><p class="text-fg3 text-xs">AI 正在为你设计专属玉器</p></div>`;

  try {
    const prompt = buildDesignPrompt(designSelections);
    const negative = buildNegativePrompt(designSelections);
    const res = await fetch(IMAGE_API, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SILICONFLOW_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: IMAGE_MODEL, prompt, negative_prompt: negative, n: 1, size: '1024x1024' })
    });
    if (res.status === 401 || res.status === 403) throw new Error('API Key 无效或无权限，请点击右上角 ⚙️ 重新填写');
    if (!res.ok) {
      const d = await res.json().catch(()=>({}));
      throw new Error(d.message || d.detail || `API错误 (${res.status})`);
    }
    const data = await res.json();
    const imgUrl = data?.data?.[0]?.url;
    if (!imgUrl) throw new Error('API返回无图片');
    // Download via our fetch to avoid CORS issues displaying cross-origin image
    const imgRes = await fetch(imgUrl);
    const blob = await imgRes.blob();
    dynastyResult = URL.createObjectURL(blob);
    const dyn = DESIGN_OPTIONS.dynasty.options.find(o => o.id === designSelections.dynasty);
    dynastyResultLabel = (dyn?.label || '') + '风格玉器';
    renderDynastyResult();

function initMap(retryCount) {
  initSilkRoadUI();
  renderRouteSwitcher();
  // Destroy old map if exists (display:none corrupts Leaflet's internal state)
  if (mapInstance) { mapInstance.remove(); mapInstance = null; routePolylines = {}; routeMarkerGroups = {}; eventLayerGroup = null; }
  const mc = document.getElementById('mapContainer');
  if (!mc) return;
  // Retry up to 8 times if container hasn't been laid out yet
  if (mc.offsetHeight === 0) {
    if (!retryCount || retryCount < 8) {
      setTimeout(() => initMap((retryCount || 0) + 1), 100);
    }
    return;
  }
  mapInstance = L.map('mapContainer', {center:[25,30],zoom:2.2,minZoom:2,maxZoom:10,zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(mapInstance);
  L.control.zoom({position:'bottomright'}).addTo(mapInstance);
  // Draw routes
  Object.entries(ROUTE_DATA).forEach(([id,r]) => {
    const poly = L.polyline(r.path, {color:r.color.line,weight:3,opacity:.8,dashArray:'10,8',lineCap:'round'}).addTo(mapInstance);
    routePolylines[id] = poly;
    const mg = L.layerGroup().addTo(mapInstance);
    routeMarkerGroups[id] = mg;
    r.markers.forEach(m => {
      const cm = L.circleMarker(m.latlng, {radius:6,fillColor:r.color.line,color:'#fff',weight:2,fillOpacity:.9}).addTo(mg);
      cm.bindPopup(`<div style="font-family:'Noto Sans SC',sans-serif;min-width:200px"><h4 style="font-family:'Noto Serif SC',serif;font-size:14px;font-weight:700;color:#f5f5f4;margin:0 0 2px">${m.name}</h4><p style="font-size:10px;color:#a8a29e;margin:0 0 6px">${m.en}</p><p style="font-size:11px;color:#a8a29e;line-height:1.5;margin:0 0 4px">${m.desc.substring(0,80)}...</p><p style="font-size:10px;color:#4ade80;margin:0">${m.artifact} · ${m.material}</p></div>`,{maxWidth:260});
      cm.on('click',() => showNodeSheet(m, r));
    });
  });
  eventLayerGroup = L.layerGroup().addTo(mapInstance);
  updateRouteStyles();
  updateTimelineEvents();
  updateEventStrip();
  updateYearLabel();
  // Keep map tiles in sync when container size changes
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (mapInstance) mapInstance.invalidateSize(); }).observe(mc);
  }
}

function updateRouteStyles() {
  Object.entries(routePolylines).forEach(([id,poly]) => {
    if (id === silkroadRoute) poly.setStyle({weight:4,opacity:1,dashArray:'12,6'});
    else poly.setStyle({weight:2,opacity:.35,dashArray:'8,10'});
  });
  const r = ROUTE_DATA[silkroadRoute];
  if (r && mapInstance) mapInstance.flyToBounds(L.latLngBounds(r.path), {padding:[40,40],maxZoom:6,duration:1});
}

function switchRoute(routeId) {

}

function stepTimeline(delta) {

function togglePlay() {

function updateTimelineEvents() {
  if (!eventLayerGroup || !mapInstance) return;
  eventLayerGroup.clearLayers();

async function doGenerateStory(kw) {
  const keyword = kw || document.getElementById('storyKeyword')?.value?.trim();
  if (!keyword) return;
  const container = document.getElementById('storyContent');
  container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 gap-6"><div class="relative w-20 h-20"><svg class="spinner w-full h-full text-jade" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" opacity=".3"/><circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="2" stroke-dasharray="90 120" stroke-linecap="round" stroke-dashoffset="30"/></svg></div><p class="font-display text-fg2 text-lg animate-pulse">翻阅千年典籍…</p><p class="text-fg3 text-xs">正在生成典故</p></div>`;

  // Try AI story generation via SiliconFlow LLM (only when the user supplied a key)
  let story = null;
  if (hasKey()) {
    try {
      const llmRes = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${SILICONFLOW_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'Qwen/Qwen2.5-7B-Instruct',
          messages: [{role:'system',content:'你是精通中国玉文化和古典文献的专家。根据关键词返回JSON: {"title":"2-6字标题","title_en":"英文","explanation":"80字以内释义","source":"经典出处","source_text":"原文引用(15字以内)"}。只返回JSON。'},
                     {role:'user',content:keyword}],
          temperature: 0.7, max_tokens: 300
        }),
        signal: AbortSignal.timeout(30000),
      });
      if (llmRes.ok) {
        const d = await llmRes.json();
        let content = d?.choices?.[0]?.message?.content || '';
        if (content.startsWith('```')) content = content.split('\n').slice(1).join('\n').replace(/```$/,'');
        story = JSON.parse(content);
        story.keyword = keyword; story.generated = true;
      }
    } catch(e) { console.warn('AI story generation failed:', e); }
  }

  // Fallback: preset matching
  if (!story) {
    story = PRESETS.find(p => p.keyword === keyword);
    if (!story) story = {keyword,title:keyword,title_en:keyword,explanation:`「${keyword}」是中国玉文化中的经典典故，蕴含古人对美玉的崇敬与哲思。玉象征仁、义、智、勇、洁五德。`,source:'玉文化典故',source_text:'玉者，石之美者也，有五德。'};
    story.generated = false;
  }

  // Try AI illustration (skipped when no key — text card still renders)
  if (hasKey()) {
    try {
      const illPrompt = `A vividly colorful Chinese ink and color painting for the story "${story.title||keyword}". Rich traditional Chinese color palette. Elegant figures, jade artifacts, ornate setting. Full color. Square format.`;
      const illRes = await fetch(IMAGE_API, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${SILICONFLOW_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: IMAGE_MODEL, prompt: illPrompt, n: 1, size: '1024x1024' }),
        signal: AbortSignal.timeout(60000),
      });
      if (illRes.ok) {
        const d = await illRes.json();
        const imgUrl = d?.data?.[0]?.url;
        if (imgUrl) {
          const imgRes = await fetch(imgUrl);
          const blob = await imgRes.blob();
          story.illustration_url = URL.createObjectURL(blob);
        }
      }
    } catch(e) { console.warn('AI illustration failed:', e); }
  }

  currentStory = story;
  renderStoryResult();
  showToast(story.generated ? 'AI已生成典故 ✨' : '已匹配预设典故');
}

function drawStoryIllustration(story) {
  const canvas = document.getElementById('storyIllustration');
  if (!canvas) return;
  const W = 420, H = 224;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#2a2824'; ctx.fillRect(0, 0, W, H);
  // Moon
  const cx = 210, cy = 100, moonR = 70;
  for (let r = moonR; r > 5; r -= 3) {
    const a = 1 - r/moonR;
    ctx.fillStyle = `rgba(230,225,215,${a*.12})`;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  }
  // Mountains
  [[170,60,360],[190,90,480],[180,50,300]].forEach(([baseY,h,w]) => {
    ctx.fillStyle = 'rgba(80,75,68,.6)'; ctx.beginPath();
    ctx.moveTo((W-w)/2, H);
    for (let i = 0; i <= 40; i++) {
      const x = (W-w)/2 + w*i/40;
      const y = baseY - h*(.4+.6*Math.sin(i*Math.PI/40)) + 8*Math.sin(i*7*Math.PI/40)*(1-i/40);
      ctx.lineTo(x, y);
    }
    ctx.lineTo((W+w)/2, H); ctx.closePath(); ctx.fill();
  });
  // Pine branch
  ctx.strokeStyle = 'rgba(100,95,85,.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(100, 160); ctx.quadraticCurveTo(115, 120, 125, 100); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const angle = -0.8 + i * .3;
    ctx.beginPath(); ctx.moveTo(112+i*2, 135-i*5);
    ctx.lineTo(112+i*2 + 18*Math.cos(angle), 135-i*5 + 18*Math.sin(angle)); ctx.stroke();
  }
  // Jade bi disc
  ctx.strokeStyle = 'rgba(74,222,128,.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(310, 150, 22, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(310, 150, 5, 0, Math.PI*2);
  ctx.fillStyle = '#2a2824'; ctx.fill(); ctx.stroke();
  // Seal stamp
  ctx.fillStyle = '#dc2626'; ctx.fillRect(340, 170, 35, 35);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(345, 175, 10, 10);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(355, 175, 10, 10);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(345, 185, 10, 10);
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(355, 185, 10, 10);
}

function shareStory() {
  if (!currentStory) return;
  const text = `【玉文化典故】${currentStory.title}\n\n${currentStory.explanation}\n\n——${currentStory.source}\n"${currentStory.source_text}"`;
  const modal = document.getElementById('modalContainer');
  modal.innerHTML = `
    <div class="fixed inset-0 z-[2000] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this)document.getElementById('modalContainer').innerHTML=''">
      <div class="bg-card border border-border rounded-t-2xl sm:rounded-2xl max-w-sm w-full p-6 space-y-4" style="animation:slideUp .3s ease-out;padding-bottom:calc(1.5rem + env(safe-area-inset-bottom,12px))">
        <div class="flex items-center justify-between"><h3 class="font-display font-bold">分享典故</h3><button onclick="document.getElementById('modalContainer').innerHTML=''" class="text-fg3 hover:text-fg2">✕</button></div>
        <div class="p-4 bg-bg rounded-xl text-sm text-fg2 leading-relaxed max-h-48 overflow-y-auto whitespace-pre-line">${text}</div>
        <button onclick="copyStoryText()" class="w-full py-3 bg-jade text-black rounded-xl font-medium text-sm active:scale-95 transition-transform">复制典故文字</button>
        <p class="text-[11px] text-fg3 text-center">可粘贴至微信/小红书分享</p>
      </div></div>`;
}

function copyStoryText() {
  if (!currentStory) return;
  const text = `【玉文化典故】${currentStory.title}\n\n${currentStory.explanation}\n\n——${currentStory.source}\n"${currentStory.source_text}"`;
  navigator.clipboard.writeText(text).then(() => { showToast('已复制，可粘贴至微信/小红书'); document.getElementById('modalContainer').innerHTML = ''; }).catch(() => showToast('复制失败'));
}
